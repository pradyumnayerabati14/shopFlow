services:
  mysql:
    image: mysql:8.0
    container_name: shopflow-mysql
    restart: unless-stopped
  
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    
    ports:
      - "3306:3306"
    
    volumes:
      - mysql_data:/var/lib/mysql
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
    
  backend:
    build: ./backend
    container_name: shopflow-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql          # ← the override that matters
      DB_PORT: 3306
    ports:
      - "9001:9001"
    depends_on:
      mysql:
        condition: service_healthy

  
volumes:
  mysql_data: